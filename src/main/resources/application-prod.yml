spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pulse}
    username: ${DATABASE_USERNAME:pulse_user}
    password: ${DATABASE_PASSWORD:pulse_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

jira:
  base-url: ${JIRA_BASE_URL}
  email: ${JIRA_EMAIL}
  api-token: ${JIRA_API_TOKEN}

github:
  token: ${GITHUB_TOKEN}
  owner: ${GITHUB_OWNER}
  repo: ${GITHUB_REPO}

openai:
  api-key: ${OPENAI_API_KEY}

server:
  port: ${PORT:8080}